name: Publish verified Windows installer
on:
  push:
    branches: [build/windows-x64-installer]
    paths: [.github/workflows/publish-windows-installer.yml]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified build and publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/actions/artifacts/14927027464/zip" > T3-Code-Quota-UI-Windows-x64.zip
          echo 'cd88e73134bba9a3c0c50b78c1d5f95e407e48b059e33f6a25970cd12a9bea3a  T3-Code-Quota-UI-Windows-x64.zip' | sha256sum -c -
          unzip -q T3-Code-Quota-UI-Windows-x64.zip
          sha256sum -c *.sha256
          gh release create windows-x64-quota-1.4.0 --repo "$REPO" --target 1f76430849c1f326588607ca56e694403730fc1e --title "T3 Code Quota UI · Windows x64" --notes "Windows x64 installer. Verified custom installation to D:\T3Code in Actions run 45408403391." *.zip *.exe *.sha256
